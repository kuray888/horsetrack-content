<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-400-italic.woff2);font-weight:400;font-style:italic}
:root{--bg:#F6F4F0;--navy:#231B6B;--ink:#1A1446;--muted:#6E6A86;--lav:#B8B0F2;--vio:#6C5FD6;--red:#E5533D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Inter,"Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
#hook{left:60px;right:60px;top:170px;text-align:center;font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:64px;line-height:1.1;color:var(--navy);z-index:5}
#hook i{font-weight:400;color:var(--vio)}
#cnt{left:0;right:0;top:330px;text-align:center;z-index:5}
#cnt span{display:inline-block;width:20px;height:20px;border-radius:50%;background:#E4E0EF;margin:0 8px}
#cnt span.on{background:var(--vio)}
.lbl{display:inline-block;font-size:30px;font-weight:800;letter-spacing:.14em;padding:12px 26px;border-radius:40px}
#say{left:90px;right:90px;top:420px;height:400px;background:#fff;border-radius:50px;box-shadow:0 24px 60px rgba(35,27,107,.10);padding:46px 56px;text-align:left}
#say .lbl{background:#EEEBFB;color:var(--navy)}
#sayT{font-family:Fraunces,"Noto Color Emoji",serif;font-style:italic;font-weight:400;font-size:66px;line-height:1.12;color:var(--ink);margin-top:34px}
#real{left:90px;right:90px;top:870px;height:430px;background:var(--navy);border-radius:50px;box-shadow:0 30px 70px rgba(35,27,107,.35);padding:46px 56px;text-align:left;transform-origin:50% 0}
#real .lbl{background:var(--red);color:#fff}
#real.ok .lbl{background:var(--lav);color:var(--navy)}
#realE{position:absolute;right:46px;top:30px;font-size:120px}
#realT{padding-right:150px;font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:64px;line-height:1.1;color:var(--bg);margin-top:34px}
#realT i{font-weight:400;color:var(--lav)}
#flash{inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
/* app */
#app{inset:0;background:var(--bg);z-index:8;display:none}
#aT{left:60px;right:60px;top:200px;text-align:center;font-family:Fraunces,serif;font-weight:700;font-size:80px;line-height:1.08;color:var(--navy)}
#aT i{font-weight:400;color:var(--vio)}
#phone{left:300px;top:430px;width:480px;height:1025px;border-radius:72px;background:#121614;padding:12px;box-shadow:0 40px 90px rgba(35,27,107,.28)}
#screen{width:100%;height:100%;border-radius:60px;overflow:hidden;background:#e7ecef}
#screen img{width:100%;display:block;transform-origin:50% 0}
.chip{position:absolute;background:var(--navy);color:var(--bg);font-size:34px;font-weight:700;padding:20px 30px;border-radius:26px;box-shadow:0 18px 40px rgba(35,27,107,.3);white-space:nowrap}
/* end */
#end{inset:0;background:var(--navy);z-index:9;display:none}
#e1{left:60px;right:60px;top:380px;text-align:center;color:var(--bg);font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:104px;line-height:1.08}
#e1 i{font-weight:400;color:var(--lav)}
#e2{left:0;right:0;top:820px;text-align:center}
#e2 span{display:inline-block;width:140px;height:140px;line-height:140px;border-radius:50%;background:var(--bg);color:var(--navy);font-family:Fraunces,serif;font-weight:700;font-size:80px;margin:0 18px}
#brand{left:150px;right:150px;top:1100px;background:var(--bg);border-radius:60px;padding:38px 0;text-align:center}
#brand .w{font-family:Fraunces,serif;font-weight:700;font-size:70px;color:var(--navy)}
#brand .s{font-size:30px;font-weight:600;color:var(--muted);margin-top:6px}
#url{left:0;right:0;top:1360px;text-align:center;color:var(--lav);font-size:42px;font-weight:600}
</style></head><body>
<div id="stage">
  <div class="abs" id="hook">Cavalière de concours :<br>ce que je dis <i>vs</i> la réalité 👀</div>
  <div class="abs" id="cnt"><span></span><span></span><span></span><span></span></div>
  <div class="abs" id="say"><span class="lbl">CE QUE JE DIS 🗣️</span><div id="sayT"></div></div>
  <div class="abs" id="real"><span class="lbl">LA RÉALITÉ</span><div id="realE"></div><div id="realT"></div></div>
  <div class="abs" id="app">
    <div class="abs" id="aT">Pour que la réalité<br><i>suive enfin</i> 😌</div>
    <div class="abs" id="phone"><div id="screen"><img src="../captures/s6.png"></div></div>
    <div class="chip" id="c1" style="left:40px;top:900px">🏆 Concours de reprise · 9h00</div>
    <div class="chip" id="c2" style="right:40px;top:1120px">🔔 Rappel activé</div>
  </div>
  <div class="abs" id="end">
    <div class="abs" id="e1">Tu dis <i>laquelle</i><br>le plus&nbsp;? 👇</div>
    <div class="abs" id="e2"><span>1</span><span>2</span><span>3</span></div>
    <div class="abs" id="brand"><div class="w">Horsetrack</div><div class="s">Gratuit pour 1 cheval · App Store</div></div>
    <div class="abs" id="url">Lien dans la bio</div>
  </div>
  <div class="abs" id="flash"></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cl=v=>Math.min(1,Math.max(0,v)), P=(t,a,d)=>cl((t-a)/d);
const oC=p=>1-Math.pow(1-p,3), io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const oB=p=>{const c1=1.8,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function tf(el,{x=0,y=0,s=1,r=0,o=1}={}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}
const R=[
 ['« Je serai prête la veille. »','🌙','Nattes à minuit, <i>filet introuvable.</i>',0],
 ['« Mon cheval est zen en concours. »','🚩','Il a vu un drapeau. <i>Fin.</i>',0],
 ['« Ses vaccins ? Évidemment à jour. »','⏰','Le dernier rappel date de <i>13 mois.</i>',0],
 ['« J’ai tout dans Horsetrack. »','✅','C’est vrai. <i>Concours, soins, rappels : tout y est.</i>',1],
];
const T0=0.9, RD=3.6, RA=1.5, APP=T0+R.length*RD, END_T=APP+3.0, END=END_T+3.4; window.END=END;
window.SOUNDS=[[0,'boom']].concat(R.flatMap((r,i)=>[[T0+i*RD,'whoosh'],[T0+i*RD+RA,r[3]?'ding':'scratch']])).concat([[APP,'whoosh'],[END_T,'whoosh']]);
let last=-1;
function render(t){
  tf($('#hook'),{s:0.7+0.3*oB(P(t,0,0.4)),o:P(t,0,0.08)});
  const i=Math.max(0,Math.min(R.length-1,Math.floor((t-T0)/RD))), st=T0+i*RD, r=R[i];
  if(i!==last){last=i;$('#sayT').textContent=r[0];$('#realE').textContent=r[1];$('#realT').innerHTML=r[2];$('#real').className='abs'+(r[3]?' ok':'');}
  $$('#cnt span').forEach((s,k)=>s.classList.toggle('on',t>=T0&&k<=i));
  const sin=oC(P(t,st,0.4)), sout=i<R.length-1?io(P(t,st+RD-0.3,0.3)):io(P(t,APP,0.3));
  tf($('#say'),{x:(1-sin)*-1100+sout*-1100,o:t<T0?0:1});
  const rp=oB(P(t,st+RA,0.4)), rout=sout;
  tf($('#real'),{y:(1-rp)*300+rout*600,s:0.85+0.15*rp,r:(r[3]?0:(i%2?2:-2))*rp,o:P(t,st+RA,0.06)*(1-rout)});
  const fl=P(t,st+RA,0.25); $('#flash').style.opacity=(t>=st+RA&&fl<1&&!r[3])?0.5*(1-fl):0;
  const shake=(t>st+RA&&t<st+RA+0.3&&!r[3])?Math.sin(t*120)*10:0; $('#stage').style.transform=`translateX(${shake}px)`;
  // app
  const a=$('#app'); a.style.display=t>=APP&&t<END_T+0.6?'block':'none';
  a.style.clipPath=`circle(${io(P(t,APP,0.5))*2200}px at 50% 60%)`;
  tf($('#aT'),{y:(1-oC(P(t,APP+0.2,0.4)))*40,o:P(t,APP+0.2,0.3)});
  const ph=oC(P(t,APP+0.2,0.6)); tf($('#phone'),{y:(1-ph)*1100});
  $('#screen img').style.transform=`scale(${1+0.04*P(t,APP,3)})`;
  [['#c1',0.9],['#c2',1.4]].forEach(([id,d],k)=>{const p=oB(P(t,APP+d,0.4));tf($(id),{s:0.4+0.6*p,r:(k?3:-3)*p,o:P(t,APP+d,0.08)});});
  // end
  const e=$('#end'); e.style.display=t>=END_T?'block':'none';
  e.style.clipPath=`circle(${io(P(t,END_T,0.5))*2200}px at 50% 100%)`;
  tf($('#e1'),{s:0.7+0.3*oB(P(t,END_T+0.25,0.45)),o:P(t,END_T+0.25,0.1)});
  $$('#e2 span').forEach((s,k)=>{const p=oB(P(t,END_T+0.6+k*0.15,0.4));tf(s,{s:p,o:P(t,END_T+0.6+k*0.15,0.05)});});
  const b=oB(P(t,END_T+1.2,0.45)), pulse=t>END_T+1.8?1+0.03*Math.sin((t-END_T)*6):1;
  tf($('#brand'),{s:(0.6+0.4*b)*pulse,o:P(t,END_T+1.2,0.1)}); tf($('#url'),{o:P(t,END_T+1.5,0.4)});
}
window.render=render; render(0);
</script></body></html>
