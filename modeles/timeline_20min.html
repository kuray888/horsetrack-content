<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-400-italic.woff2);font-weight:400;font-style:italic}
:root{--bg:#F6F4F0;--navy:#231B6B;--ink:#1A1446;--muted:#6E6A86;--lav:#B8B0F2;--vio:#6C5FD6;--red:#E5533D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Inter,"Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
#hook{left:40px;right:40px;top:130px;text-align:center;font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:110px;line-height:1.04;color:var(--navy);z-index:5}
#hook i{font-weight:400;color:var(--vio)}
#clock{left:150px;right:150px;top:420px;height:300px;border-radius:50px;background:var(--navy);color:var(--bg);text-align:center;box-shadow:0 26px 60px rgba(35,27,107,.25)}
#time{font-family:Inter,sans-serif;font-weight:800;font-size:190px;line-height:300px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#bar{left:150px;right:150px;top:760px;height:34px;border-radius:20px;background:#E4E0EF;overflow:hidden}
#fill{height:100%;width:0;background:var(--vio);border-radius:20px}
#late{left:0;right:0;top:810px;text-align:center;font-size:44px;font-weight:800;color:var(--muted)}
#late b{color:var(--red)}
#card{left:80px;right:80px;top:920px;height:560px;border-radius:60px;padding:50px 60px;background:#fff;outline:10px solid var(--vio);box-shadow:0 30px 70px rgba(35,27,107,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#em{font-size:150px;line-height:1;margin-bottom:34px}
#tx{font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:72px;line-height:1.12;color:var(--ink)}
#tx i{font-weight:400;color:var(--vio)}
#sub{left:0;right:0;top:1560px;text-align:center;font-size:42px;font-weight:700;color:var(--muted)}
#app{inset:0;background:var(--bg);z-index:8;display:none}
#aT{left:60px;right:60px;top:200px;text-align:center;font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:88px;line-height:1.08;color:var(--navy)}
#aT i{font-weight:400;color:var(--vio)}
#shot{left:90px;right:90px;top:560px;border-radius:44px;overflow:hidden;box-shadow:0 40px 90px rgba(35,27,107,.28);background:#fff}
#shot img{width:100%;display:block}
#aS{left:0;right:0;top:1560px;text-align:center;font-size:44px;font-weight:700;color:var(--muted)}
#end{inset:0;background:var(--navy);z-index:9;display:none}
#e1{left:60px;right:60px;top:360px;text-align:center;color:var(--bg);font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:100px;line-height:1.08}
#e1 i{font-weight:400;color:var(--lav)}
#brand{left:150px;right:150px;top:1060px;background:var(--bg);border-radius:60px;padding:38px 0;text-align:center}
#brand .w{font-family:Fraunces,serif;font-weight:700;font-size:70px;color:var(--navy)}
#brand .su{font-size:30px;font-weight:600;color:var(--muted);margin-top:6px}
#url{left:0;right:0;top:1320px;text-align:center;color:var(--lav);font-size:42px;font-weight:600;line-height:1.4}
</style></head><body>
<div id="stage">
  <div class="abs" id="hook">« J’y vais<br><i>20 minutes</i>. »</div>
  <div class="abs" id="clock"><div id="time">14:00</div></div>
  <div class="abs" id="bar"><div id="fill"></div></div>
  <div class="abs" id="late">prévu : 20 min</div>
  <div class="abs" id="card"><div id="em"></div><div id="tx"></div></div>
  <div class="abs" id="sub">Envoie-le à celui qui t’attend pour dîner 👀</div>
  <div class="abs" id="app">
    <div class="abs" id="aT">Au moins,<br><i>la séance est notée</i> 📔</div>
    <div class="abs" id="shot"><img src="../captures/journal_crop.png"></div>
    <div class="abs" id="aS">Le journal Horsetrack : séance, photo, ressenti</div>
  </div>
  <div class="abs" id="end">
    <div class="abs" id="e1">Toi, «&nbsp;20&nbsp;minutes&nbsp;»,<br><i>ça fait combien</i>&nbsp;? 👇</div>
    <div class="abs" id="brand"><div class="w">Horsetrack</div><div class="su">Gratuit pour 1 cheval · iPhone</div></div>
    <div class="abs" id="url">Lien dans la bio</div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const cl=v=>Math.min(1,Math.max(0,v)), P=(t,a,d)=>cl((t-a)/d);
const oC=p=>1-Math.pow(1-p,3), io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const oB=p=>{const c1=1.8,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function tf(el,{x=0,y=0,s=1,r=0,o=1}={}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}
const NB=' ';
const F=[
 [840,'🚗','« J’y vais 20 minutes,<br><i>je reviens</i>. »'],
 [860,'🥾','Il est au fond du pré.<br><i>Évidemment.</i>'],
 [885,'🪮','Pansage.<br><i>Les pieds, la crinière, la boue.</i>'],
 [910,'☕','Ta copine d’écurie&nbsp;:<br><i>« juste 5 min de papote »</i>'],
 [965,'🐴','Enfin à cheval.<br><i>45 minutes de séance.</i>'],
 [1010,'🥕','Douche, carotte, bisou.<br><i>Re-bisou.</i>'],
 [1055,'🧹','Tu ranges la sellerie.<br><i>Pas la tienne.</i>'],
 [1092,'📱','Ton copain&nbsp;:<br><i>« tu rentres quand&nbsp;? »</i>']
];
const T0=1.2, RD=1.6, APP=T0+(F.length-1)*RD+1.9, END_T=APP+2.8, END=END_T+3.2; window.END=END;
window.SOUNDS=[[0,'pop']].concat(F.slice(1).map((f,i)=>[T0+i*RD,i==F.length-2?'notif':'tick'])).concat([[APP,'whoosh'],[APP+0.6,'pop'],[END_T,'whoosh'],[END_T+1.0,'ding']]);
const hm=m=>{m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(h+NB+'h'+(r?NB+String(r).padStart(2,'0'):'')):(r+NB+'min')};
let last=-2;
function render(t){
  tf($('#hook'),{s:1+0.02*Math.sin(t*5)});
  // horloge : glisse vers l'heure de la carte courante
  const cur=t<T0?0:Math.min(F.length-1,Math.floor((t-T0)/RD)+1);
  const cIdx=Math.min(F.length-1,cur);
  const st=T0+(cIdx-1)*RD; // carte 0 visible dès t=0
  const prev=F[Math.max(0,cIdx-1)][0], tgt=F[cIdx][0];
  const mins=cIdx===0?F[0][0]:prev+(tgt-prev)*io(P(t,st,0.45));
  $('#time').textContent=hm(mins);
  const el=mins-F[0][0];
  $('#fill').style.width=Math.min(100,el/20*100)+'%';
  $('#fill').style.background=el>20?'var(--red)':'var(--vio)';
  $('#late').innerHTML=el<=20?'prévu'+NB+': 20'+NB+'min':'prévu'+NB+': 20'+NB+'min · réel'+NB+': <b>'+dur(el)+'</b>';
  if(cIdx!==last){last=cIdx;$('#em').textContent=F[cIdx][1];$('#tx').innerHTML=F[cIdx][2];}
  if(cIdx===0){tf($('#card'),{s:1,o:1});}
  else{const p=oB(P(t,st,0.35));tf($('#card'),{s:0.85+0.15*p,r:(cIdx%2?-2:2)*(1-p),o:P(t,st,0.08)});}
  const sh=(cIdx>0&&t>st&&t<st+0.2)?Math.sin(t*120)*6:0; tf($('#clock'),{x:sh,s:cIdx>0?1+0.05*(1-P(t,st,0.3)):1});
  tf($('#sub'),{o:0.6+0.4*Math.sin(t*3)**2});
  const a=$('#app'); a.style.display=t>=APP&&t<END_T+0.6?'block':'none';
  a.style.clipPath=`circle(${io(P(t,APP,0.5))*2200}px at 50% 50%)`;
  tf($('#aT'),{y:(1-oC(P(t,APP+0.2,0.4)))*40,o:P(t,APP+0.2,0.3)});
  tf($('#shot'),{y:(1-oC(P(t,APP+0.3,0.6)))*900,s:1+0.03*P(t,APP+0.9,2)});
  tf($('#aS'),{o:P(t,APP+0.9,0.3)});
  const e=$('#end'); e.style.display=t>=END_T?'block':'none';
  e.style.clipPath=`circle(${io(P(t,END_T,0.5))*2200}px at 50% 100%)`;
  tf($('#e1'),{s:0.7+0.3*oB(P(t,END_T+0.25,0.45)),o:P(t,END_T+0.25,0.1)});
  const b=oB(P(t,END_T+1.0,0.45)), pulse=t>END_T+1.6?1+0.03*Math.sin((t-END_T)*6):1;
  tf($('#brand'),{s:(0.6+0.4*b)*pulse,o:P(t,END_T+1.0,0.1)}); tf($('#url'),{o:P(t,END_T+1.3,0.4)});
}
window.render=render; render(0);
</script></body></html>
