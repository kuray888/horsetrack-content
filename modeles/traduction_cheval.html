<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-400-italic.woff2);font-weight:400;font-style:italic}
:root{--bg:#F6F4F0;--navy:#231B6B;--ink:#1A1446;--muted:#6E6A86;--lav:#B8B0F2;--vio:#6C5FD6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
body{font-family:Inter,"Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
.abs{position:absolute}
#hook{left:40px;right:40px;top:90px;text-align:center;color:var(--bg);font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:80px;line-height:1.05;z-index:5}
#hook i{font-weight:400;color:var(--lav)}
#tag{left:0;right:0;top:300px;text-align:center;z-index:5}
#tag span{display:inline-block;background:var(--vio);color:#fff;font-size:30px;font-weight:800;letter-spacing:3px;padding:10px 26px;border-radius:30px}
.card{left:90px;top:390px;width:900px;height:900px;border-radius:48px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45);background:#000}
.card img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 45%}
.lui{left:70px;right:70px;top:1330px;text-align:center;color:var(--lav);font-size:50px;font-weight:600;line-height:1.25}
.lui b{color:var(--bg);font-weight:800}
.tr{left:50px;right:50px;top:1470px;text-align:center}
.tr span{display:inline-block;background:var(--bg);color:var(--ink);font-family:Fraunces,"Noto Color Emoji",serif;font-style:italic;font-size:66px;line-height:1.12;padding:26px 44px;border-radius:40px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.tr small{display:block;font-family:Inter,sans-serif;font-style:normal;font-size:28px;font-weight:800;letter-spacing:3px;color:var(--vio);margin-bottom:6px}
#app{inset:0;background:var(--bg);z-index:8;display:none}
#aT{left:60px;right:60px;top:150px;text-align:center;font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:78px;line-height:1.08;color:var(--navy)}
#aT i{font-weight:400;color:var(--vio)}
#jc{left:90px;top:470px;width:900px;border-radius:44px;overflow:hidden;box-shadow:0 30px 70px rgba(35,27,107,.25)}
#jc img{width:100%;display:block}
#aB{left:60px;right:60px;top:1450px;text-align:center;font-size:42px;font-weight:700;color:var(--navy);line-height:1.3}
#end{inset:0;background:var(--navy);z-index:9;display:none}
#e1{left:50px;right:50px;top:400px;text-align:center;color:var(--bg);font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:92px;line-height:1.1}
#e1 i{font-weight:400;color:var(--lav)}
#brand{left:150px;right:150px;top:1060px;background:var(--bg);border-radius:60px;padding:38px 0;text-align:center}
#brand .w{font-family:Fraunces,serif;font-weight:700;font-size:70px;color:var(--navy)}
#brand .su{font-size:30px;font-weight:600;color:var(--muted);margin-top:6px}
#url{left:0;right:0;top:1320px;text-align:center;color:var(--lav);font-size:40px;font-weight:600}
</style></head><body>
<div id="stage">
  <div class="abs" id="hook">Ce que ton cheval<br>veut <i>vraiment</i> dire 🐴</div>
  <div class="abs" id="tag"><span>TRADUCTION CHEVAL → FRANÇAIS</span></div>
  <div id="scenes"></div>
  <div class="abs" id="app">
    <div class="abs" id="aT">Et sa vraie humeur,<br><i>tu la notes où ?</i> 📒</div>
    <div class="abs" id="jc"><img src="../captures/journal_crop.png"></div>
    <div class="abs" id="aB">Dans son journal Horsetrack :<br>la séance, la photo, ton ressenti</div>
  </div>
  <div class="abs" id="end">
    <div class="abs" id="e1">Envoie-le à celle<br><i>qui parle cheval<br>couramment</i></div>
    <div class="abs" id="brand"><div class="w">Horsetrack</div><div class="su">Gratuit pour 1 cheval · iPhone</div></div>
    <div class="abs" id="url">Lien dans la bio</div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const cl=v=>Math.min(1,Math.max(0,v)), P=(t,a,d)=>cl((t-a)/d);
const oC=p=>1-Math.pow(1-p,3), io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const oB=p=>{const c1=1.8,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function tf(el,{x=0,y=0,s=1,r=0,o=1}={}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}
const SC=[
 ['p1_calin','Il pose sa tête<br><b>contre toi</b> 🥹','« t’as des carottes<br>dans la poche gauche.<br>je sais. »'],
 ['p2_tete','Il te regarde arriver<br><b>avec le licol</b>','« non. »'],
 ['p3_saut','Il saute l’oxer<br><b>sans hésiter</b>','« je refuserai la petite<br>croix tout à l’heure 🙂 »'],
 ['p4_regard','Il te fixe<br><b>après la séance</b>','« note que j’ai été<br>parfait. »']];
const D=3.1, R=0.9; // durée d'une scène, apparition de la traduction
const box=$('#scenes');
SC.forEach((s,i)=>{box.insertAdjacentHTML('beforeend',`<div class="sc" id="s${i}"><div class="abs card"><img src="../captures/photos/${s[0]}.jpg"></div><div class="abs lui">${s[1]}</div><div class="abs tr"><span><small>TRADUCTION</small>${s[2]}</span></div></div>`);});
const APP=SC.length*D, END_T=APP+3.4, END=END_T+3.2; window.END=END;
const snd=[]; SC.forEach((s,i)=>{if(i)snd.push([i*D,'whoosh']); snd.push([i*D+(i?R:0.45),'pop']);}); snd.push([APP,'whoosh'],[APP+1.2,'ding'],[END_T,'whoosh']);
window.SOUNDS=snd;
function render(t){
  SC.forEach((s,i)=>{const el=$('#s'+i), st=i*D, on=t>=st&&t<st+D+0.01&&t<APP; el.style.display=on?'block':'none'; if(!on)return;
    const RR=i?R:0.45, k=t-st, ent=i?oC(P(k,0,0.35)):1;
    const c=el.querySelector('.card'); tf(c,{x:(1-ent)*1100,r:(1-ent)*4});
    c.querySelector('img').style.transform=`scale(${1.02+0.07*k/D})`;
    tf(el.querySelector('.lui'),{o:i?P(k,0.1,0.2):1,y:i?(1-oC(P(k,0.1,0.3)))*30:0});
    const tp=oB(P(k,RR,0.35)); tf(el.querySelector('.tr'),{s:0.4+0.6*tp,o:P(k,RR,0.06),r:(1-tp)*-4});
  });
  tf($('#hook'),{s:1+0.015*Math.sin(t*5)});
  const a=$('#app'); a.style.display=t>=APP&&t<END_T+0.6?'block':'none';
  a.style.clipPath=`circle(${io(P(t,APP,0.5))*2200}px at 50% 40%)`;
  tf($('#aT'),{o:P(t,APP+0.2,0.3),y:(1-oC(P(t,APP+0.2,0.4)))*40});
  tf($('#jc'),{y:(1-oC(P(t,APP+0.3,0.6)))*1300});
  tf($('#aB'),{o:P(t,APP+1.2,0.3)});
  const e=$('#end'); e.style.display=t>=END_T?'block':'none';
  e.style.clipPath=`circle(${io(P(t,END_T,0.5))*2200}px at 50% 100%)`;
  tf($('#e1'),{s:0.7+0.3*oB(P(t,END_T+0.25,0.45)),o:P(t,END_T+0.25,0.1)});
  const b=oB(P(t,END_T+1.0,0.45)); tf($('#brand'),{s:0.6+0.4*b,o:P(t,END_T+1.0,0.1)}); tf($('#url'),{o:P(t,END_T+1.3,0.4)});
}
window.render=render; render(0);
</script></body></html>
