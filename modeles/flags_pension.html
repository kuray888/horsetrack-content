<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-400-italic.woff2);font-weight:400;font-style:italic}
:root{--bg:#F6F4F0;--navy:#231B6B;--ink:#1A1446;--muted:#6E6A86;--lav:#B8B0F2;--vio:#6C5FD6;--red:#E5533D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Inter,"Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
#hook{left:50px;right:50px;top:150px;text-align:center;font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:92px;line-height:1.06;color:var(--navy);z-index:5}
#hook i{font-weight:400;color:var(--vio)}
#cnt{left:0;right:0;top:470px;text-align:center;z-index:5}
#cnt span{display:inline-block;width:22px;height:22px;border-radius:50%;background:#E4E0EF;margin:0 9px}
#cnt span.r{background:var(--red)}#cnt span.g{background:var(--vio)}
#card{left:80px;right:80px;top:600px;height:760px;border-radius:60px;padding:60px 60px;box-shadow:0 30px 70px rgba(35,27,107,.25);transform-origin:50% 50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#card.r{background:#fff;outline:10px solid var(--red)}
#card.g{background:var(--navy)}
#lbl{display:inline-block;font-size:40px;font-weight:800;letter-spacing:.14em;padding:16px 34px;border-radius:50px}
#card.r #lbl{background:var(--red);color:#fff}
#card.g #lbl{background:var(--lav);color:var(--navy)}
#em{font-size:150px;line-height:1;margin:40px 0 30px}
#tx{font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:70px;line-height:1.12}
#card.r #tx{color:var(--ink)} #card.g #tx{color:var(--bg)}
#tx i{font-weight:400}
#card.r #tx i{color:var(--red)} #card.g #tx i{color:var(--lav)}
#sub{left:0;right:0;top:1460px;text-align:center;font-size:40px;font-weight:700;color:var(--muted)}
#flash{inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
#app{inset:0;background:var(--bg);z-index:8;display:none}
#aT{left:60px;right:60px;top:180px;text-align:center;font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:84px;line-height:1.08;color:var(--navy)}
#aT i{font-weight:400;color:var(--vio)}
#phone{left:300px;top:450px;width:480px;height:1025px;border-radius:72px;background:#121614;padding:12px;box-shadow:0 40px 90px rgba(35,27,107,.28)}
#screen{width:100%;height:100%;border-radius:60px;overflow:hidden;background:#e7ecef}
#screen img{width:100%;display:block;transform-origin:50% 40%}
.ac{position:absolute;background:var(--navy);color:var(--bg);font-size:38px;font-weight:700;padding:22px 32px;border-radius:26px;box-shadow:0 18px 40px rgba(35,27,107,.3);white-space:nowrap}
#end{inset:0;background:var(--navy);z-index:9;display:none}
#e1{left:60px;right:60px;top:380px;text-align:center;color:var(--bg);font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:100px;line-height:1.08}
#e1 i{font-weight:400;color:var(--lav)}
#brand{left:150px;right:150px;top:1060px;background:var(--bg);border-radius:60px;padding:38px 0;text-align:center}
#brand .w{font-family:Fraunces,serif;font-weight:700;font-size:70px;color:var(--navy)}
#brand .su{font-size:30px;font-weight:600;color:var(--muted);margin-top:6px}
#url{left:0;right:0;top:1320px;text-align:center;color:var(--lav);font-size:42px;font-weight:600}
</style></head><body>
<div id="stage">
  <div class="abs" id="hook">Red flags 🚩 <i>vs</i><br>green flags 💚<br><i>d’une pension</i></div>
  <div class="abs" id="cnt"></div>
  <div class="abs" id="card"><span id="lbl"></span><div id="em"></div><div id="tx"></div></div>
  <div class="abs" id="sub">Envoie-le à ta copine d’écurie 👀</div>
  <div class="abs" id="app">
    <div class="abs" id="aT">Le vrai green flag :<br><i>tu sais quand il passe</i> 😌</div>
    <div class="abs" id="phone"><div id="screen"><img src="../captures/s6.png"></div></div>
    <div class="ac" id="c1" style="left:40px;top:1240px">🔨 Ferrure · 9h00</div>
    <div class="ac" id="c2" style="right:40px;top:1400px">🔔 Rappel la veille</div>
  </div>
  <div class="abs" id="end">
    <div class="abs" id="e1">Ton pire<br><i>red flag</i><br>de pension ? 👇</div>
    <div class="abs" id="brand"><div class="w">Horsetrack</div><div class="su">Gratuit pour 1 cheval · iPhone</div></div>
    <div class="abs" id="url">Lien dans la bio</div>
  </div>
  <div class="abs" id="flash"></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cl=v=>Math.min(1,Math.max(0,v)), P=(t,a,d)=>cl((t-a)/d);
const oC=p=>1-Math.pow(1-p,3), io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const oB=p=>{const c1=1.8,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function tf(el,{x=0,y=0,s=1,r=0,o=1}={}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}
const F=[
 ['r','🌾','« Le foin ?<br><i>On verra demain.</i> »'],
 ['g','🥰','Le gérant connaît<br>le prénom de ton cheval<br><i>(et ses manies)</i>'],
 ['r','🧥','Les couvertures<br>de tout le monde<br><i>mélangées en sellerie</i>'],
 ['g','🔑','Chaque casier<br><i>a son nom dessus</i>'],
 ['r','🔨','Personne ne sait<br><i>quand passe le maréchal</i>'],
 ['g','🔔','Toi, tu le sais :<br><i>rappel la veille</i>'],
];
const cnt=$('#cnt'); F.forEach(()=>cnt.appendChild(document.createElement('span')));
const T0=0.7, RD=2.1, APP=T0+F.length*RD, END_T=APP+3.2, END=END_T+3.4; window.END=END;
window.SOUNDS=[[0,'boom']].concat(F.map((f,i)=>[T0+i*RD,f[0]=='r'?'scratch':'ding'])).concat([[APP,'whoosh'],[APP+0.9,'pop'],[APP+1.4,'pop'],[END_T,'whoosh']]);
let last=-2;
function render(t){
  tf($('#hook'),{s:1+0.025*Math.sin(t*5)});
  const i=t<T0?-1:Math.min(F.length-1,Math.floor((t-T0)/RD));
  if(i!==last){last=i;
    if(i<0){$('#card').className='abs r';$('#lbl').textContent='RED FLAG 🚩';$('#em').textContent=F[0][1];$('#tx').innerHTML=F[0][2];}
    else{const f=F[i];$('#card').className='abs '+f[0];$('#lbl').textContent=f[0]=='r'?'RED FLAG 🚩':'GREEN FLAG 💚';$('#em').textContent=f[1];$('#tx').innerHTML=f[2];}
  }
  $$('#cnt span').forEach((s,k)=>{s.className=(i>=0&&k<=i)?F[k][0]:'';});
  if(i<0){ // 1re image : la 1re carte est déjà là (pas d'écran vide)
    tf($('#card'),{s:1,o:1});
  } else {
    const st=T0+i*RD, p=oB(P(t,st,0.35)), out=io(P(t,st+RD-0.25,0.25))*(i<F.length-1?1:0);
    tf($('#card'),{s:0.8+0.2*p,r:(F[i][0]=='r'?-2:2)*(1-p),o:1-out, x:out*-900});
    const fl=P(t,st,0.22); $('#flash').style.opacity=(i>0&&F[i][0]=='r'&&fl<1)?0.45*(1-fl):0;
    const sh=(t>st&&t<st+0.25&&F[i][0]=='r'&&i>0)?Math.sin(t*120)*10:0; $('#stage').style.transform=`translateX(${sh}px)`;
  }
  tf($('#sub'),{o:0.6+0.4*Math.sin(t*3)**2});
  const a=$('#app'); a.style.display=t>=APP&&t<END_T+0.6?'block':'none';
  a.style.clipPath=`circle(${io(P(t,APP,0.5))*2200}px at 50% 50%)`;
  tf($('#aT'),{y:(1-oC(P(t,APP+0.2,0.4)))*40,o:P(t,APP+0.2,0.3)});
  tf($('#phone'),{y:(1-oC(P(t,APP+0.2,0.6)))*1100});
  $('#screen img').style.transform=`scale(${1+0.05*P(t,APP,3.5)})`;
  [['#c1',0.9],['#c2',1.4]].forEach(([id,d],k)=>{const p=oB(P(t,APP+d,0.4));tf($(id),{s:0.4+0.6*p,r:(k?3:-3)*p,o:P(t,APP+d,0.08)});});
  const e=$('#end'); e.style.display=t>=END_T?'block':'none';
  e.style.clipPath=`circle(${io(P(t,END_T,0.5))*2200}px at 50% 100%)`;
  tf($('#e1'),{s:0.7+0.3*oB(P(t,END_T+0.25,0.45)),o:P(t,END_T+0.25,0.1)});
  const b=oB(P(t,END_T+1.0,0.45)), pulse=t>END_T+1.6?1+0.03*Math.sin((t-END_T)*6):1;
  tf($('#brand'),{s:(0.6+0.4*b)*pulse,o:P(t,END_T+1.0,0.1)}); tf($('#url'),{o:P(t,END_T+1.3,0.4)});
}
window.render=render; render(0);
</script></body></html>
