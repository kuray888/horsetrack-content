<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Fraunces;src:url(polices/fraunces-latin-400-italic.woff2);font-weight:400;font-style:italic}
:root{--bg:#F6F4F0;--navy:#231B6B;--ink:#1A1446;--muted:#6E6A86;--lav:#B8B0F2;--vio:#6C5FD6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
body{font-family:Inter,"Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
.abs{position:absolute}
#top{left:60px;right:60px;top:170px;text-align:center;color:var(--bg);font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:82px;line-height:1.08}
#top i{font-weight:400;color:var(--lav)}
#sub{left:0;right:0;top:395px;text-align:center}
#sub b{display:inline-block;background:var(--lav);color:var(--navy);font-size:38px;font-weight:800;padding:14px 34px;border-radius:50px;letter-spacing:.04em}
#card{left:110px;width:860px;top:560px;height:940px;background:var(--bg);border-radius:60px;box-shadow:0 40px 100px rgba(0,0,0,.35);text-align:center;padding:0 70px 70px;display:flex;flex-direction:column;justify-content:center;align-items:center}
#card .e{font-size:210px;line-height:1}
#card .t{font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:86px;line-height:1.05;color:var(--navy);margin-top:60px}
#card .d{font-size:46px;line-height:1.3;color:var(--muted);margin-top:36px;font-weight:500}
#card .f{position:absolute;left:0;right:0;bottom:44px;font-size:28px;font-weight:700;letter-spacing:.16em;color:#B5B1C7}
#card.star{background:#fff;outline:10px solid var(--lav)}
#card.star .f{color:var(--vio)}
#ghost1,#ghost2{left:130px;width:820px;top:590px;height:940px;border-radius:60px;background:rgba(246,244,240,.18)}
#ghost2{left:150px;width:780px;top:620px;background:rgba(246,244,240,.09)}
#bar{left:110px;width:860px;top:1560px;height:14px;border-radius:10px;background:rgba(246,244,240,.15);overflow:hidden}
#bar i{display:block;height:100%;background:var(--lav);width:0}
#end{inset:0;background:var(--navy);display:none;z-index:9}
#en1{left:60px;right:60px;top:560px;text-align:center;color:var(--bg);font-family:Fraunces,"Noto Color Emoji",serif;font-weight:700;font-size:112px;line-height:1.08}
#en1 i{font-weight:400;color:var(--lav)}
#en2{left:0;right:0;top:1000px;text-align:center;color:rgba(246,244,240,.8);font-size:46px;font-weight:600}
#en3{left:0;right:0;top:1200px;text-align:center;color:var(--lav);font-family:Fraunces,serif;font-weight:700;font-size:64px}
</style></head><body>
<div id="stage">
  <div class="abs" id="top">Mets pause ⏸️<br><i>au hasard</i></div>
  <div class="abs" id="sub"><b>QUEL CHEVAL AS-TU&nbsp;?</b></div>
  <div class="abs" id="ghost2"></div><div class="abs" id="ghost1"></div>
  <div class="abs" id="card"><div class="e" id="ce"></div><div class="t" id="ct"></div><div class="d" id="cd"></div><div class="f">HORSETRACK</div></div>
  <div class="abs" id="bar"><i id="bi"></i></div>
  <div class="abs" id="end">
    <div class="abs" id="en1">Alors, il est <i>lequel</i>&nbsp;? 👇</div>
    <div class="abs" id="en2">Commente le résultat (et identifie son cheval)</div>
    <div class="abs" id="en3">Horsetrack</div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const cl=v=>Math.min(1,Math.max(0,v)), P=(t,a,d)=>cl((t-a)/d);
const oC=p=>1-Math.pow(1-p,3), io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const oB=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function tf(el,{x=0,y=0,s=1,r=0,o=1}={}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}
const CARDS=[
 ['🍎','Le gourmand','Il te suit uniquement si tes poches font du bruit.'],
 ['🎭','La drama queen','Une feuille a bougé. C’est la fin du monde.'],
 ['🚜','Le bulldozer','Il passe. Toujours. Même là où il ne faut pas.'],
 ['😴','Le flemmard','Le trot ? Plutôt demain.'],
 ['🧠','Le génie de l’évasion','Aucune clôture ne lui résiste.'],
 ['🛁','Le roi de la boue','Pansé à 14h, gris à 14h05.'],
 ['😎','Celui qui a sa fiche Horsetrack','Soins, rappels, journal : rien ne lui manque.','star'],
 ['🗣️','Le bavard','Il hennit dès qu’il entend ta voiture.'],
 ['🧸','Le pot de colle','Il te suit partout dans le pré.'],
 ['🥕','Le négociateur','Pas de carotte, pas de travail.'],
 ['⚡','L’électrique','Démarrage au quart de tour. Sans prévenir.'],
 ['🦄','Le parfait','Il existe. Paraît-il.'],
 ['👑','Le chef du pré','Personne ne mange avant lui.'],
 ['🙈','Le peureux','Le seau bleu ? Un monstre.'],
 ['🥇','Le compétiteur','Au paddock, il sait déjà qu’il va gagner.'],
 ['😎','Celui qui a sa fiche Horsetrack','Maréchal, vaccins, ostéo : tout est noté.','star'],
];
const START=0.55, DT=0.43, N=CARDS.length, ENDC=START+N*DT, END=ENDC+2.2; window.END=END;
window.SOUNDS=CARDS.map((c,i)=>[START+i*DT,'tick']);
let last=-1;
function setCard(i){if(i===last)return;last=i;const c=CARDS[i];$('#ce').textContent=c[0];$('#ct').textContent=c[1];$('#cd').textContent=c[2];$('#card').className='abs'+(c[3]?' star':'');}
function render(t){
  tf($('#top'),{s:0.7+0.3*oB(P(t,0,0.4)),o:P(t,0,0.08)});
  tf($('#sub'),{y:(1-oC(P(t,0.15,0.35)))*30,o:P(t,0.15,0.2)});
  const i=Math.min(N-1,Math.max(0,Math.floor((t-START)/DT)));
  setCard(i);
  const ct=t-START-i*DT, p=t<START?0:oB(P(ct,0,0.12));
  const rot=[-2,1.5,-1,2,-1.5,1][i%6];
  tf($('#card'),{y:t<START?60:(1-p)*-50,s:t<START?0.9:0.94+0.06*p,r:rot*p,o:t<START?P(t,0.2,0.3):1});
  $('#bi').style.width=(cl((t-START)/(N*DT))*100)+'%';
  const e=$('#end'); e.style.display=t>=ENDC?'block':'none';
  e.style.clipPath=`circle(${io(P(t,ENDC,0.45))*2200}px at 50% 55%)`;
  tf($('#en1'),{s:0.7+0.3*oB(P(t,ENDC+0.2,0.45)),o:P(t,ENDC+0.2,0.1)});
  tf($('#en2'),{o:P(t,ENDC+0.6,0.3)}); tf($('#en3'),{o:P(t,ENDC+0.9,0.3)});
}
window.render=render; render(0);
</script></body></html>
